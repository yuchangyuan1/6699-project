experiment:
  name: "exp_a_mlp"
  model: "mlp"
  seeds: [42, 123, 456, 789, 2024]

data:
  dataset: "fashion_mnist"
  batch_size: 128
  num_workers: 0
  data_dir: "data/"

training:
  epochs: 30
  loss: "cross_entropy"

optimizers:
  sgd:
    lr: 1.0e-2
    momentum: 0.9
    weight_decay: 0.0
  adam:
    lr: 1.0e-3
    betas: [0.9, 0.999]
    eps: 1.0e-8
    weight_decay: 0.0

metrics:
  loss_thresholds: [2.0, 1.0, 0.5, 0.2]
  log_grad_norm: false

output:
  base_dir: "outputs/exp_a_mlp"
